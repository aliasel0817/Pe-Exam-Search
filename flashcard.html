<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기술사 토픽 자동 암기장</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    
    <style>
        /* 스크롤바 부드러운 스타일 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8 font-sans text-gray-800">
    <div class="max-w-6xl mx-auto">
        
        <!-- 상단 헤더 영역 -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-2">
            <h1 onclick="location.reload()" class="text-2xl font-bold text-gray-800 cursor-pointer hover:text-blue-600 transition tracking-tight" title="페이지 새로고침">
                📖 기술사 토픽 암기장
            </h1>
            <div class="flex flex-col items-end mt-2 sm:mt-0">
                <span id="db-status-badge" class="px-2 py-1 bg-blue-100 text-blue-800 text-xs font-bold rounded">
                    데이터 불러오는 중...
                </span>
                <button onclick="fetchExcelData(true)" class="mt-2 text-xs bg-blue-50 text-blue-600 border border-blue-200 px-3 py-1.5 rounded hover:bg-blue-100 transition whitespace-nowrap">
                    🔄 최신 데이터 갱신
                </button>
            </div>
        </div>
        <p class="text-sm text-gray-500 mb-6">최신 데이터가 자동으로 동기화됩니다.</p>
        
        <!-- 검색 조건 패널 (검색기 스타일 적용) -->
        <div class="bg-white p-4 md:p-6 rounded-lg shadow-sm mb-8 grid grid-cols-1 md:grid-cols-6 gap-4 border-t-4 border-blue-500">
            <div class="md:col-span-3">
                <label class="block text-sm font-medium text-gray-700 mb-1">토픽 및 키워드 검색 (띄어쓰기 시 AND)</label>
                <input type="text" id="keyword" placeholder="예: ITSM 프로세스" class="block w-full p-2.5 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 text-sm transition">
            </div>
            
            <div class="md:col-span-1">
                <label class="block text-sm font-medium text-gray-700 mb-1">도메인</label>
                <select id="domain" class="block w-full p-2.5 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 text-sm bg-white transition cursor-pointer">
                    <option value="">전체</option>
                    <option value="MG">MG (경영)</option>
                    <option value="SW">SW (소프트웨어)</option>
                    <option value="SV">SV (보안)</option>
                    <option value="AI">AI (인공지능)</option>
                    <option value="ST">ST (통계)</option>
                    <option value="AL">AL (알고리즘)</option>
                    <option value="DB">DB (데이터베이스)</option>
                    <option value="NW">NW (네트워크)</option>
                    <option value="SE">SE (시스템엔지니어링)</option>
                    <option value="OS">OS (운영체제)</option>
                    <option value="CA">CA (컴퓨터구조)</option>
                </select>
            </div>
            
            <div class="md:col-span-1">
                <label class="block text-sm font-medium text-gray-700 mb-1">중요도</label>
                <select id="importance" class="block w-full p-2.5 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 text-sm bg-white transition cursor-pointer">
                    <option value="">전체</option>
                    <option value="상">상</option>
                    <option value="중">중</option>
                    <option value="하">하</option>
                </select>
            </div>
            
            <div class="md:col-span-1 flex items-end space-x-2">
                <button onclick="applyFilters()" class="w-full bg-slate-700 text-white font-semibold py-2.5 px-3 rounded-md hover:bg-slate-800 transition shadow-sm text-sm h-[42px]">
                    조회
                </button>
                <button onclick="resetFilters()" class="w-full bg-gray-400 text-white font-semibold py-2.5 px-3 rounded-md hover:bg-gray-500 transition shadow-sm text-sm h-[42px]">
                    초기화
                </button>
            </div>
        </div>

        <!-- 메인 암기장 카드 영역 -->
        <div class="flex items-center justify-center w-full gap-4 md:gap-8">
            
            <!-- 좌측 화살표 (소프트 UI) -->
            <button onclick="prevCard()" class="hidden md:flex flex-shrink-0 items-center justify-center w-14 h-14 rounded-full bg-white shadow-sm border border-gray-200 text-gray-400 hover:text-blue-600 hover:shadow-md hover:-translate-x-1 transition-all cursor-pointer" title="이전 토픽 (방향키 ←)">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            
            <!-- 플래시 카드 본체 -->
            <div class="w-full max-w-4xl bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden flex flex-col">
                
                <!-- 1. 카드 헤더 (메타 정보) -->
                <div class="flex bg-slate-50 border-b border-gray-200 text-sm font-medium text-gray-500 divide-x divide-gray-200">
                    <div class="flex-1 p-3 text-center truncate">NO: <span id="card-no" class="font-bold text-slate-700"></span></div>
                    <div class="flex-1 p-3 text-center truncate">도메인: <span id="card-domain" class="font-bold text-blue-600"></span></div>
                    <div class="flex-1 p-3 text-center truncate">중요도: <span id="card-importance" class="font-bold text-red-500"></span></div>
                </div>
                
                <!-- 2. 토픽명 -->
                <div class="p-6 md:p-8 text-xl md:text-3xl font-extrabold text-gray-800 text-center border-b border-gray-100 flex items-center justify-center min-h-[100px]" id="card-topic">
                    <!-- 토픽 내용 바인딩 -->
                </div>
                
                <!-- 3. 키워드 영역 -->
                <div class="flex flex-col md:flex-row border-b border-gray-100">
                    <div class="md:w-36 bg-slate-50/50 p-4 flex items-center justify-center font-semibold text-slate-600 border-r-0 md:border-r border-gray-100 text-sm md:text-base">
                        키워드
                    </div>
                    <div class="flex-1 p-5 md:p-7 text-gray-700 text-sm md:text-base h-[280px] md:h-[350px] overflow-y-auto leading-relaxed custom-scrollbar whitespace-normal" id="card-keyword">
                        <!-- 키워드 내용 바인딩 -->
                    </div>
                </div>
                
                <!-- 4. 연관 토픽 영역 -->
                <div class="flex flex-col md:flex-row border-b border-gray-100">
                    <div class="md:w-36 bg-slate-50/50 p-4 flex items-center justify-center font-semibold text-slate-600 border-r-0 md:border-r border-gray-100 text-sm md:text-base text-center">
                        연관 토픽
                    </div>
                    <div class="flex-1 p-4 md:p-5 text-gray-800 font-medium text-sm md:text-base flex items-center justify-center md:justify-start" id="card-related">
                        <!-- 연관토픽 내용 바인딩 -->
                    </div>
                </div>
                
                <!-- 5. 암기법 영역 -->
                <div class="flex flex-col md:flex-row bg-blue-50/30">
                    <div class="md:w-36 p-4 flex items-center justify-center font-bold text-blue-800 border-r-0 md:border-r border-blue-100/50 text-sm md:text-base">
                        암기법
                    </div>
                    <div class="flex-1 p-5 text-indigo-700 font-extrabold text-lg md:text-xl flex items-center justify-center md:justify-start" id="card-memo">
                        <!-- 암기법 내용 바인딩 -->
                    </div>
                </div>
            </div>

            <!-- 우측 화살표 (소프트 UI) -->
            <button onclick="nextCard()" class="hidden md:flex flex-shrink-0 items-center justify-center w-14 h-14 rounded-full bg-white shadow-sm border border-gray-200 text-gray-400 hover:text-blue-600 hover:shadow-md hover:translate-x-1 transition-all cursor-pointer" title="다음 토픽 (방향키 →)">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>

        <!-- 모바일 전용 이전/다음 컨트롤러 (화면이 작을 때만 표시) -->
        <div class="md:hidden flex justify-between items-center w-full mt-6 bg-white rounded-lg shadow-sm border border-gray-200 p-2">
            <button onclick="prevCard()" class="px-5 py-2.5 bg-slate-100 text-slate-700 rounded-md font-semibold hover:bg-slate-200 transition text-sm">◀ 이전</button>
            <div id="mobile-pagination" class="font-bold text-sm text-gray-500">0 / 0</div>
            <button onclick="nextCard()" class="px-5 py-2.5 bg-blue-50 text-blue-700 rounded-md font-semibold hover:bg-blue-100 transition text-sm">다음 ▶</button>
        </div>
        
        <!-- 하단 페이징(Pagination) 버튼 영역 (검색기 스타일 적용) -->
        <div id="pagination" class="flex justify-center items-center space-x-1.5 mt-8 mb-12 flex-wrap gap-y-2">
            <!-- 자바스크립트로 버튼이 생성됩니다. -->
        </div>
        
    </div>

    <script>
        let globalData = [];
        let currentFilteredData = [];
        let currentIndex = 0; 
        
        const DB_KEY = 'pe_topic_memo_db';
        const EXCEL_FILE_URL = './Topic_list.xlsx'; 

        async function initApp() {
            try {
                const savedData = await localforage.getItem(DB_KEY);
                
                if (savedData && savedData.length > 0) {
                    globalData = savedData;
                    document.getElementById('db-status-badge').className = "px-2 py-1 bg-green-100 text-green-800 text-xs font-bold rounded";
                    document.getElementById('db-status-badge').innerText = "✅ 로컬 캐시 사용됨";
                    resetFilters();
                    fetchExcelData(false); 
                } else {
                    fetchExcelData(true);
                }
            } catch (err) {
                console.error("초기화 에러:", err);
                fetchExcelData(true); 
            }
        }

        async function fetchExcelData(showLoadingUI = true) {
            if (showLoadingUI) {
                document.getElementById('db-status-badge').className = "px-2 py-1 bg-yellow-100 text-yellow-800 text-xs font-bold rounded";
                document.getElementById('db-status-badge').innerText = "🔄 서버 데이터 다운로드 중...";
            }

            try {
                const response = await fetch(`${EXCEL_FILE_URL}?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                const parsedData = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
                
                if (parsedData.length > 0) {
                    globalData = parsedData;
                    await localforage.setItem(DB_KEY, parsedData);
                    
                    if (showLoadingUI) {
                        document.getElementById('db-status-badge').className = "px-2 py-1 bg-green-100 text-green-800 text-xs font-bold rounded";
                        document.getElementById('db-status-badge').innerText = "✅ 최신 동기화 완료";
                        resetFilters();
                    }
                }
            } catch (error) {
                console.error("데이터 동기화 실패:", error);
                if (showLoadingUI && globalData.length === 0) {
                    document.getElementById('db-status-badge').className = "px-2 py-1 bg-red-100 text-red-800 text-xs font-bold rounded";
                    document.getElementById('db-status-badge').innerText = "❌ 다운로드 실패";
                    alert('Topic_list.xlsx 파일을 불러오지 못했습니다. 파일 위치를 확인해주세요.');
                }
            }
        }

        document.getElementById('keyword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') applyFilters();
        });

        function applyFilters() {
            if (globalData.length === 0) return;

            const keywordStr = document.getElementById('keyword').value.trim();
            const domain = document.getElementById('domain').value;
            const importance = document.getElementById('importance').value;

            const keywords = keywordStr ? keywordStr.split(/\s+/) : [];

            currentFilteredData = globalData.filter(row => {
                const rowTopic = String(row['토픽'] || '').toLowerCase();
                const rowKeyword = String(row['키워드'] || '').toLowerCase();
                const searchableText = rowTopic + " " + rowKeyword;
                
                const rowDomain = String(row['도메인'] || '');
                const rowImportance = String(row['중요도'] || '');

                let keywordMatch = true;
                if (keywords.length > 0) {
                    for (let kw of keywords) {
                        if (!searchableText.includes(kw.toLowerCase())) {
                            keywordMatch = false;
                            break;
                        }
                    }
                }

                const domainMatch = domain === "" || rowDomain.includes(domain);
                const importanceMatch = importance === "" || rowImportance === importance;

                return keywordMatch && domainMatch && importanceMatch;
            });

            currentFilteredData.sort((a, b) => {
                let valA = Number(a['NO']) || 0;
                let valB = Number(b['NO']) || 0;
                return valA - valB;
            });

            currentIndex = 0;
            renderCard();
        }

        function resetFilters() {
            document.getElementById('keyword').value = '';
            document.getElementById('domain').value = '';
            document.getElementById('importance').value = '';
            applyFilters(); 
        }

        function renderCard() {
            const total = currentFilteredData.length;
            
            if (total === 0) {
                document.getElementById('card-no').innerText = '-';
                document.getElementById('card-domain').innerText = '-';
                document.getElementById('card-importance').innerText = '-';
                document.getElementById('card-topic').innerHTML = '<span class="text-gray-400 font-medium text-lg">조건에 맞는 토픽이 없습니다.</span>';
                document.getElementById('card-keyword').innerHTML = '';
                document.getElementById('card-related').innerHTML = '';
                document.getElementById('card-memo').innerHTML = '';
                renderPagination();
                return;
            }

            const item = currentFilteredData[currentIndex];

            document.getElementById('card-no').innerText = item['NO'] || '-';
            document.getElementById('card-domain').innerText = item['도메인'] || '-';
            document.getElementById('card-importance').innerText = item['중요도'] || '-';
            
            document.getElementById('card-topic').innerHTML = formatText(item['토픽']);
            document.getElementById('card-keyword').innerHTML = formatText(item['키워드']);
            document.getElementById('card-related').innerHTML = formatText(item['연관토픽']);
            document.getElementById('card-memo').innerHTML = formatText(item['암기법']);

            renderPagination();
        }

        function formatText(text) {
            if (!text) return '-';
            let safeText = String(text).replace(/</g, "&lt;").replace(/>/g, "&gt;");
            let compressedText = safeText.replace(/(?:\r\n|\r|\n)+/g, '\n');
            return compressedText.replace(/\n/g, '<br>');
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        function nextCard() {
            if (currentFilteredData.length > 0 && currentIndex < currentFilteredData.length - 1) {
                currentIndex++;
                renderCard();
            }
        }

        function goToCard(idx) {
            if (idx >= 0 && idx < currentFilteredData.length) {
                currentIndex = idx;
                renderCard();
            }
        }

        // 키보드 방향키 이동 지원
        document.addEventListener('keydown', function(e) {
            if (document.activeElement.id !== 'keyword') {
                if (e.key === 'ArrowLeft') prevCard();
                else if (e.key === 'ArrowRight') nextCard();
            }
        });

        // 하단 모던 스타일 페이징 렌더링
        function renderPagination() {
            const total = currentFilteredData.length;
            const paginationDiv = document.getElementById('pagination');
            const mobilePageText = document.getElementById('mobile-pagination');
            
            if (total === 0) {
                paginationDiv.innerHTML = '';
                if(mobilePageText) mobilePageText.innerText = '0 / 0';
                return;
            }

            if(mobilePageText) mobilePageText.innerText = `${currentIndex + 1} / ${total}`;

            let html = '';
            
            let start = Math.max(0, currentIndex - 3);
            let end = Math.min(total - 1, start + 6);
            if (end - start < 6) {
                start = Math.max(0, end - 6);
            }

            // 첫 페이지 버튼
            if (start > 0) {
                html += `<button onclick="goToCard(0)" class="px-3 py-1.5 min-w-[36px] bg-white border border-gray-300 rounded-md hover:bg-gray-100 text-sm font-medium text-gray-600 transition">1</button>`;
                if (start > 1) html += `<span class="px-1 text-gray-400">...</span>`;
            }

            // 번호 버튼들
            for (let i = start; i <= end; i++) {
                if (i === currentIndex) {
                    html += `<button class="px-3 py-1.5 min-w-[36px] bg-blue-600 border border-blue-600 rounded-md text-sm font-bold text-white shadow-sm">${i + 1}</button>`;
                } else {
                    html += `<button onclick="goToCard(${i})" class="px-3 py-1.5 min-w-[36px] bg-white border border-gray-300 rounded-md hover:bg-gray-100 text-sm font-medium text-gray-600 transition">${i + 1}</button>`;
                }
            }

            // 끝 페이지 버튼
            if (end < total - 1) {
                if (end < total - 2) html += `<span class="px-1 text-gray-400">...</span>`;
                html += `<button onclick="goToCard(${total - 1})" class="px-3 py-1.5 min-w-[36px] bg-white border border-gray-300 rounded-md hover:bg-gray-100 text-sm font-medium text-gray-600 transition">${total}</button>`;
            }

            paginationDiv.innerHTML = html;
        }

        window.onload = initApp;
    </script>
</body>
</html>
