<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>빠른 메모장</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: #f4f7f6; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            margin: 0;
        }
        .container { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 500px; 
        }
        h2 { margin-top: 0; color: #333; }
        textarea { 
            width: 100%; 
            height: 100px; 
            padding: 12px; 
            box-sizing: border-box; 
            border-radius: 8px; 
            border: 1px solid #ccc; 
            resize: vertical; 
            margin-bottom: 12px; 
            font-family: inherit;
            font-size: 14px;
        }
        textarea:focus { outline: none; border-color: #007BFF; }
        .btn-save { 
            background: #007BFF; 
            color: white; 
            border: none; 
            padding: 12px 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-save:hover { background: #0056b3; }
        .note-list { 
            margin-top: 25px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .note-item { 
            background: #fdfdfd; 
            padding: 15px; 
            border-radius: 8px; 
            border-left: 4px solid #007BFF; 
            border-right: 1px solid #eee;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            position: relative; 
            word-wrap: break-word;
            white-space: pre-wrap; /* 줄바꿈 유지 */
        }
        .delete-btn { 
            position: absolute; 
            top: 12px; 
            right: 12px; 
            background: #ff4d4d; 
            color: white; 
            border: none; 
            padding: 5px 10px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 12px; 
        }
        .delete-btn:hover { background: #cc0000; }
        .timestamp { 
            font-size: 12px; 
            color: #888; 
            margin-bottom: 8px; 
            display: block; 
        }
        .note-content { font-size: 14px; color: #333; line-height: 1.5; padding-right: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📌 웹 탐색 메모</h2>
        <textarea id="noteInput" placeholder="검색 중 발견한 내용이나 아이디어를 입력하세요... (Enter로 저장, Shift+Enter로 줄바꿈)"></textarea>
        <button class="btn-save" onclick="addNote()">메모 저장</button>
        <div class="note-list" id="noteList"></div>
    </div>

    <script>
        // 로컬 스토리지에서 기존 메모 데이터 불러오기
        let notes = JSON.parse(localStorage.getItem('web_notes')) || [];

        // 메모 목록을 화면에 그리는 함수
        function renderNotes() {
            const listElement = document.getElementById('noteList');
            listElement.innerHTML = '';
            
            // 최신 메모가 상단에 오도록 배열을 복사한 뒤 뒤집어서 출력
            notes.slice().reverse().forEach((note, index) => {
                const originalIndex = notes.length - 1 - index; // 실제 배열의 인덱스 추적
                
                const div = document.createElement('div');
                div.className = 'note-item';
                
                const time = document.createElement('span');
                time.className = 'timestamp';
                time.textContent = note.timestamp;
                
                const text = document.createElement('div');
                text.className = 'note-content';
                text.textContent = note.text;
                
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.textContent = '삭제';
                delBtn.onclick = () => deleteNote(originalIndex);
                
                div.appendChild(time);
                div.appendChild(text);
                div.appendChild(delBtn);
                
                listElement.appendChild(div);
            });
        }

        // 새 메모 추가 함수
        function addNote() {
            const input = document.getElementById('noteInput');
            const text = input.value.trim();
            
            if (text) {
                const newNote = {
                    text: text,
                    timestamp: new Date().toLocaleString('ko-KR')
                };
                notes.push(newNote);
                localStorage.setItem('web_notes', JSON.stringify(notes));
                input.value = ''; // 입력창 초기화
                renderNotes();
            }
        }

        // 메모 삭제 함수
        function deleteNote(index) {
            if(confirm('이 메모를 삭제하시겠습니까?')) {
               notes.splice(index, 1);
                localStorage.setItem('web_notes', JSON.stringify(notes));
                renderNotes();
            }
        }

        // 단축키 지원 (Enter 누르면 저장, Shift+Enter는 줄바꿈)
        document.getElementById('noteInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); // 기본 줄바꿈 방지
                addNote();
            }
        });

        // 앱 실행 시 초기 렌더링
        renderNotes();
    </script>
</body>
</html>
