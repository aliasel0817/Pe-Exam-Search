<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>빠른 메모장</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: #f4f7f6; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            margin: 0;
        }
        .container { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 500px; 
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        h2 { margin: 0; color: #333; font-size: 20px; }
        
        textarea.main-input { 
            width: 100%; 
            height: 100px; 
            padding: 12px; 
            box-sizing: border-box; 
            border-radius: 8px; 
            border: 1px solid #ccc; 
            resize: vertical; 
            margin-bottom: 12px; 
            font-family: inherit;
            font-size: 14px;
        }
        textarea.main-input:focus { outline: none; border-color: #007BFF; }
        
        .btn-save-main { 
            background: #007BFF; 
            color: white; 
            border: none; 
            padding: 12px 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-save-main:hover { background: #0056b3; }
        
        .btn-delete-all {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .btn-delete-all:hover { background: #cc0000; }

        .note-list { 
            margin-top: 25px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .note-item { 
            background: #fdfdfd; 
            padding: 15px; 
            border-radius: 8px; 
            border-left: 4px solid #007BFF; 
            border: 1px solid #eee;
            border-left-width: 4px;
            border-left-color: #007BFF;
            position: relative; 
            word-wrap: break-word;
            white-space: pre-wrap; 
        }
        
        /* 버튼 그룹 (수정, 삭제) */
        .action-buttons {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 5px;
        }
        .btn-small {
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-edit { background: #28a745; }
        .btn-edit:hover { background: #218838; }
        .btn-delete { background: #6c757d; }
        .btn-delete:hover { background: #5a6268; }
        
        .timestamp { 
            font-size: 12px; 
            color: #888; 
            margin-bottom: 8px; 
            display: block; 
        }
        .note-content { font-size: 14px; color: #333; line-height: 1.5; padding-right: 80px; }
        
        /* 수정 모드용 입력창 */
        .edit-textarea {
            width: 100%;
            height: 80px;
            margin-top: 5px;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
        }
        .edit-textarea:focus { outline: none; border-color: #28a745; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>📌 웹 탐색 메모</h2>
            <button class="btn-delete-all" onclick="deleteAllNotes()">전체 삭제</button>
        </div>
        <textarea id="noteInput" class="main-input" placeholder="검색 중 발견한 내용이나 아이디어를 입력하세요... (Enter로 저장, Shift+Enter로 줄바꿈)"></textarea>
        <button class="btn-save-main" onclick="addNote()">메모 추가</button>
        <div class="note-list" id="noteList"></div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('web_notes')) || [];
        let editingIndex = -1; // 현재 수정 중인 메모의 인덱스를 저장

        function renderNotes() {
            const listElement = document.getElementById('noteList');
            listElement.innerHTML = '';
            
            notes.slice().reverse().forEach((note, index) => {
                const originalIndex = notes.length - 1 - index;
                
                const div = document.createElement('div');
                div.className = 'note-item';
                
                const time = document.createElement('span');
                time.className = 'timestamp';
                
                // 수정 모드와 일반 모드 분기
                if (editingIndex === originalIndex) {
                    time.textContent = note.timestamp + ' (수정 중)';
                    
                    const editArea = document.createElement('textarea');
                    editArea.className = 'edit-textarea';
                    editArea.value = note.text;
                    
                    const actionDiv = document.createElement('div');
                    actionDiv.className = 'action-buttons';
                    
                    const saveBtn = document.createElement('button');
                    saveBtn.className = 'btn-small btn-edit';
                    saveBtn.textContent = '저장';
                    saveBtn.onclick = () => saveEdit(originalIndex, editArea.value);
                    
                    const cancelBtn = document.createElement('button');
                    cancelBtn.className = 'btn-small btn-delete';
                    cancelBtn.textContent = '취소';
                    cancelBtn.onclick = () => { editingIndex = -1; renderNotes(); };
                    
                    actionDiv.appendChild(saveBtn);
                    actionDiv.appendChild(cancelBtn);
                    
                    div.appendChild(time);
                    div.appendChild(editArea);
                    div.appendChild(actionDiv);
                } else {
                    time.textContent = note.timestamp;
                    
                    const text = document.createElement('div');
                    text.className = 'note-content';
                    text.textContent = note.text;
                    
                    const actionDiv = document.createElement('div');
                    actionDiv.className = 'action-buttons';
                    
                    const editBtn = document.createElement('button');
                    editBtn.className = 'btn-small btn-edit';
                    editBtn.textContent = '수정';
                    editBtn.onclick = () => { editingIndex = originalIndex; renderNotes(); };
                    
                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-small btn-delete';
                    delBtn.style.background = '#ff4d4d'; // 삭제 버튼은 빨간색 강조
                    delBtn.textContent = '삭제';
                    delBtn.onclick = () => deleteNote(originalIndex);
                    
                    actionDiv.appendChild(editBtn);
                    actionDiv.appendChild(delBtn);
                    
                    div.appendChild(time);
                    div.appendChild(text);
                    div.appendChild(actionDiv);
                }
                
                listElement.appendChild(div);
            });
        }

        function addNote() {
            const input = document.getElementById('noteInput');
            const text = input.value.trim();
            
            if (text) {
                const newNote = {
                    text: text,
                    timestamp: new Date().toLocaleString('ko-KR')
                };
                notes.push(newNote);
                saveToLocalStorage();
                input.value = ''; 
                editingIndex = -1; // 새 메모 추가 시 수정 모드 해제
                renderNotes();
            }
        }

        function saveEdit(index, newText) {
            if (newText.trim()) {
                notes[index].text = newText.trim();
                notes[index].timestamp = new Date().toLocaleString('ko-KR') + ' (수정됨)';
                saveToLocalStorage();
                editingIndex = -1;
                renderNotes();
            } else {
                alert('내용을 입력해주세요.');
            }
        }

        function deleteNote(index) {
            if(confirm('이 메모를 삭제하시겠습니까?')) {
                notes.splice(index, 1);
                saveToLocalStorage();
                renderNotes();
            }
        }

        function deleteAllNotes() {
            if (notes.length === 0) {
                alert('삭제할 메모가 없습니다.');
                return;
            }
            if(confirm('🚨 정말 모든 메모를 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) {
                notes = [];
                saveToLocalStorage();
                renderNotes();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('web_notes', JSON.stringify(notes));
        }

        // 단축키 지원 (Enter 누르면 저장, Shift+Enter는 줄바꿈)
        document.getElementById('noteInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); 
                addNote();
            }
        });

        // 앱 실행 시 초기 렌더링
        renderNotes();
    </script>
</body>
</html>
