name: TTS development checks

on:
  push:
    branches:
      - feature/ai-natural-tts-20261009
    paths:
      - "study-note/tts/**"
      - "study-note/study-note.html"
      - ".github/workflows/tts-dev-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: node --check study-note/tts/natural-tts.js
      - name: Exercise AI MP3 player with mocked browser/audio
        run: node --test study-note/tts/test_player.cjs
      - name: Test private GCS signed URL gateway without cloud credentials
        run: node --test study-note/tts/cloud-gateway/test_gateway.cjs
      - name: Verify Python syntax
        run: python3 -m py_compile study-note/tts/generate_mp3.py study-note/tts/upload_gcs.py
      - name: Verify Cloud Shell and gated deployment script syntax
        run: bash -n study-note/tts/verify_cloud_services.sh study-note/tts/cloud-gateway/deploy_pilot.sh study-note/tts/cloud-gateway/preflight_build.sh study-note/tts/cloud-gateway/setup_build_identity.sh
      - name: Run tests without cloud API
        run: python3 -m unittest discover -s study-note/tts -p 'test_*.py' -v
      - name: Verify all five APIs enabled; Cloud Run deployment still requires user billing consent
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path('study-note/tts')
          project = json.loads((base / 'cloud-project.json').read_text(encoding='utf-8'))
          conf = json.loads((base / 'cloud-config.json').read_text(encoding='utf-8'))
          assert project['projectId'] == 'study-note-tts'
          assert str(project['projectNumber']) == '558407087449'
          assert project['billingLinkedUserConfirmed'] is True
          assert project['budgetAlertsUserConfirmed'] is True
          assert project['budgetName'] == 'Study-Note-TTS-Budget'
          assert project['plannedBucketName'] == 'study-note-tts-audio-558407087449'
          assert project['bucketCreatedUserConfirmed'] is True
          assert project['bucketName'] == 'study-note-tts-audio-558407087449'
          assert project['gcsCorsUserConfirmed'] is True
          assert project['plannedServiceAccountId'] == 'study-tts-audio-reader'
          assert project['plannedServiceAccountEmail'] == 'study-tts-audio-reader@study-note-tts.iam.gserviceaccount.com'
          assert project['serviceAccountCreatedUserConfirmed'] is True
          assert project['bucketReaderIamUserConfirmed'] is True
          assert project['signBlobRoleUserConfirmed'] is True
          assert project['plannedEnabledApis'] == ['iamcredentials.googleapis.com','texttospeech.googleapis.com','run.googleapis.com']
          assert project['requiredApisUserConfirmed'] is True
          assert project['gcsCorsEffectiveVerified'] is True
          assert project['oauthWebClientIdCandidate'] == '1054197140509-60r8da165v63qghfn6558o5d48crl02g.apps.googleusercontent.com'
          assert project['oauthReusedClientVerified'] is False
          assert project['plannedBuildApis'] == ['cloudbuild.googleapis.com','artifactregistry.googleapis.com']
          assert project['buildApisUserConfirmed'] is True
          assert project['cloudRunServicesCheckedUserConfirmed'] is True
          assert project['cloudRunServiceCountAtVerification'] == 0
          assert project['cloudRunDeploymentUserApproved'] is False
          assert project['cloudBuildIdentityCheckedUserConfirmed'] is True
          assert project['cloudBuildRoleStatus'] == 'default_compute_direct_role_not_found'
          assert project['observedDefaultBuildServiceAccount'] == '558407087449-compute@developer.gserviceaccount.com'
          assert project['dedicatedBuildServiceAccountId'] == 'study-tts-build'
          assert project['dedicatedBuildServiceAccountEmail'] == 'study-tts-build@study-note-tts.iam.gserviceaccount.com'
          assert project['dedicatedBuildRolePlanned'] == 'roles/run.builder'
          assert project['dedicatedBuildServiceAccountCreatedUserConfirmed'] is True
          assert project['dedicatedBuildRoleGrantedUserConfirmed'] is False
          assert project['cloudRunDeploymentUserConfirmed'] is False
          assert project['cloudRunServiceNamePlanned'] == 'study-tts-audio-gateway'
          assert project['buildApisEnableCommandSuccess'] is True
          assert conf['oauthClientId'] == project['oauthWebClientIdCandidate']
          assert project['plannedSigningRole'] == 'roles/iam.serviceAccountTokenCreator'
          assert project['plannedSigningPrincipal'] == 'serviceAccount:study-tts-audio-reader@study-note-tts.iam.gserviceaccount.com'
          assert project['plannedSigningScope'] == 'study-tts-audio-reader@study-note-tts.iam.gserviceaccount.com'
          assert project['plannedReaderBucketName'] == 'study-note-tts-audio-558407087449'
          assert project['plannedReaderBucketRole'] == 'roles/storage.objectViewer'
          cors = json.loads((base / 'cloud-gateway/gcs-cors.json').read_text(encoding='utf-8'))
          assert isinstance(cors,list) and len(cors) == 1
          assert set(cors[0]['origin']) == {'https://aliasel0817.github.io','http://localhost:8765'}
          assert set(cors[0]['method']) == {'GET','HEAD'}
          assert cors[0]['maxAgeSeconds'] == 3600
          assert all(project[key] is False for key in (
              'cloudProvisioningApproved', 'ttsGenerationApproved', 'gcsUploadApproved'))
          assert conf['mode'] == 'disabled'
          print('All five APIs active, Cloud Run empty, deployment needs express owner approval; GCS upload and TTS generation remain locked')
          PY
      - name: Prevent Google login code-flow conflict and secret exposure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          base=Path('study-note')
          html=(base/'study-note.html').read_text(encoding='utf-8')
          tts=(base/'tts/natural-tts.js').read_text(encoding='utf-8')
          config=json.loads((base/'tts/cloud-config.json').read_text(encoding='utf-8'))
          match=re.search(r"const GOOGLE_OAUTH_CLIENT_ID = '([^']+)'", html)
          assert match and match.group(1)==config['oauthClientId']
          assert 'google.accounts.oauth2.initCodeClient' in html
          assert 'google.accounts.id.initialize' not in html
          assert 'gis.initialize' in tts and 'gis.renderButton' in tts
          assert config['mode']=='disabled' and config['gatewayUrl']==''
          print('Existing OAuth2 code flow kept intact; separate GSI ID-token button prepared, no cloud backend enabled')
          PY
      - name: Verify TTS module is linked from development HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('study-note/study-note.html').read_text(encoding='utf-8')
          required = [
            'id="ttsCloudLogin"',
            'id="ttsCloudStatus"',
            'id="ttsToggleBtn"',
            'id="ttsSettingsPanel"',
            'window.peStudyNoteTtsBridge',
            '<script src="./tts/natural-tts.js"></script>',
            'window.peStudyNoteTTS?.onTopicChanged(topicId);',
          ]
          for item in required:
            assert item in s, item
          print('TTS markup and topic navigation bridge found')
          PY
