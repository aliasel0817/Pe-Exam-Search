name: Study Note Visibility Browser QA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visibility-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm system Chrome
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser
          (google-chrome --version || chromium --version || chromium-browser --version)
      - name: Install Korean fallback font for readable screenshot QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-match -f '%{family}\n' 'Noto Sans CJK KR'
      - name: Install temporary browser driver (no repository lockfile change)
        run: npm install --prefix .qa-browser --no-save --no-audit --no-fund puppeteer-core@24.31.0
      - name: Fetch pinned PDF.js 3.11.174 for real canvas rendering QA
        run: |
          mkdir -p .qa-browser/pdfjs
          curl --fail --location --silent --show-error --retry 3 \
            https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js \
            -o .qa-browser/pdfjs/pdf.min.js
          curl --fail --location --silent --show-error --retry 3 \
            https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js \
            -o .qa-browser/pdfjs/pdf.worker.min.js
          echo '5b5799e6f8c680663207ac5b42ee14eed2a406fa7af48f50c154f0c0b1566946  .qa-browser/pdfjs/pdf.min.js' | sha256sum -c -
          echo 'feabdf309770ed24bba31a5467836cdc8cf639c705af27d52b585b041bb8527b  .qa-browser/pdfjs/pdf.worker.min.js' | sha256sum -c -
      - name: Run full-PWA DOM and responsive screen QA against synthetic topics
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          if [ ! -x "$CHROME_BIN" ]; then
            CHROME_BIN="$(command -v chromium || command -v chromium-browser)"
            export CHROME_BIN
          fi
          node study-note/tests/test_visibility_browser_qa.cjs
          node study-note/tests/test_annotation_pointer_split.cjs
          node study-note/tests/test_image_viewer_loading.cjs
          node study-note/tests/test_image_upload_webp98.cjs
          node study-note/tests/test_image_upload_webp98_browser.cjs
          node study-note/tests/test_pdf_reference_fit_browser_qa.cjs
          node study-note/tests/test_reference_pdf_auto_backend_browser_qa.cjs
          node study-note/tests/test_reference_pdf_real_pdfjs_browser_qa.cjs
      - name: Verify production read-only image mapping and media bytes (canary)
        run: node study-note/tests/test_live_image_readback_canary.cjs
          node study-note/tests/test_pdf_mobile_touch_pinch.cjs
          node study-note/tests/test_pdf_device_input_qa.cjs
      - name: Upload synthetic QA screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-note-visibility-browser-${{ github.run_number }}
          path: study-note/qa-artifacts/visibility-browser/
          if-no-files-found: warn
          retention-days: 14
