# M7 isolated acceptance checks. No release, deployment, secrets or external MuPDF distribution.
name: MuPDF M7 private final stabilization checks

on:
  pull_request:
    branches: [integration/mupdf-migration]
    paths:
      - 'study-note/study-note.html'
      - 'study-note/mupdf-migration/**'
      - '.github/workflows/mupdf-m7-final-stabilization.yml'

permissions:
  contents: read

jobs:
  isolated-final-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Private-only asset staging, checksum and closed release gate
        working-directory: study-note/mupdf-migration/m2
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node m2-stage-assets.cjs
          node m2-verify-assets.cjs
          node -e "const x=require('./m2-release-gate.cjs').stateCheck();if(x.assetBinaryReleasePermitted||x.productionDeployPermitted)process.exit(1)"
      - name: Pinned non-production renderer dependencies
        working-directory: study-note/mupdf-migration/m3
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: M7 queue invalidation and source preservation
        run: node --test study-note/mupdf-migration/m7/tests/m7.test.mjs
      - name: M6 interaction regressions
        run: node --test study-note/mupdf-migration/m6/tests/m6.test.mjs
      - name: M5 attachment regressions
        run: node --test study-note/mupdf-migration/m5/tests/m5.test.mjs
      - name: M4 signed PDF regressions
        run: node --test study-note/mupdf-migration/m4/tests/m4.test.mjs
      - name: M3 Worker and renderer regressions
        run: node --test study-note/mupdf-migration/m3/tests/*.test.mjs
      - name: M2 package and gate regressions
        run: node --test study-note/mupdf-migration/m2/m2.test.cjs
      - name: M1 auth and security regressions
        run: node --test study-note/mupdf-migration/m1/m1-audit.test.cjs
      - name: Existing fallback smoke
        run: node study-note/tests/test_pdf_vector_sharp_qa.cjs
      - name: Runtime package audit
        working-directory: study-note/mupdf-migration/m3
        run: npm audit --omit=dev --audit-level=moderate
      - name: Disallow public MuPDF bundles and captured PDF/ink
        run: |
          if git ls-files | grep -E '(^|/)\.m[2-7]-private/|study-note/mupdf-migration/m[4-7]/.+\.(pdf|png|jpg|jpeg)$'; then
            echo 'Private MuPDF binary or QA artifact was tracked'; exit 1
          fi
      - name: Heuristic secret pattern screening
        run: node study-note/mupdf-migration/m1/m1-secret-scan.cjs --root .

# Physical Galaxy Tab S11 / iPhone Safari and authenticated GET are NOT certified by this CI.
# Windows Chrome synthetic browser acceptance is run locally and documented separately.
